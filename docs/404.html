<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>LinkPoint - Global Client Connection Solutions</title>
    <script>
      // Redirect 404 to index.html for SPA routing
      var path = window.location.pathname;
      var segments = path.split('/').filter(Boolean);
      if (segments.length > 0 && segments[0] === 'linkpoint') {
        segments.shift();
      }
      sessionStorage.redirect = '/' + segments.join('/');
      window.location.href = '/linkpoint/';
    </script>
  </head>
  <body></body>
</html>
